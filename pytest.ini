[pytest]
testpaths = tests
pythonpath = .
addopts =
    --strict-markers
    --strict-config
    -ra
markers =
    protocol: exact wire/binary encodings sent to hardware - a wrong bit moves a real motor
    geometry: scan-pattern maths and coordinate invariants
    conformance: plugin classes satisfy the ABC the dynamic loader assumes
    contract: controller lifecycle and guard rails
    hygiene: static checks that lock in the dead-code cleanup
    slow: takes more than a second
filterwarnings =
    default
